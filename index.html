    <!-- 2. COVER -->
    <section class="slide slide--cover" id="cover">
      <div class="stage">
        <img src="assets/Cover.svg" alt="Nandut's Birthday Party, 17 Oktober. Terima kasih sudah hadir, 25 tahun di dunia, semoga Nandut semakin di depan." draggable="false">
      </div>
    </section>

    <!-- 3. GALLERY PHOTO -->
    <section class="slide slide--photos" id="photos">
      <div>
        <p>Bertambahnya usiamu adalah hadiah bagi dunia, tapi hadirmu di hidupku adalah anugerah terindah yang pernah kumiliki. Selamat ulang tahun serta mulia untuk seseorang yang membuat hatiku menemukan rumah.</p>
      </div>
      <div class="duo duo--photos">
        <img class="duo__a" src="assets/gallery-photo-left.png" width="315" height="599" alt="Dua foto polaroid Nandut." draggable="false">
        <img class="duo__b" src="assets/gallery-photo-right.png" width="524" height="599" alt="Foto polaroid berdua dengan balon ulang tahun." draggable="false">
      </div>
    </section>

    <!-- 4. GALLERY VIDEO -->
    <section class="slide slide--video" id="video">
      <div class="stage">
        <img src="assets/Gallery_Video.svg" alt="" draggable="false">

        <!-- Layar ponsel: video asli ditumpuk di atas frame diam dari Canva -->
        <div class="screen" id="screen">
          <video id="clip" src="assets/video.mp4" muted loop playsinline preload="metadata"
                 aria-label="Video kenangan di pantai"></video>

          <svg class="story-ui" viewBox="0 0 312 641" aria-hidden="true">
            <defs>
              <linearGradient id="shadeTop" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#000" stop-opacity=".38"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="shadeBottom" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0" stop-color="#000" stop-opacity=".38"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <rect width="312" height="120" fill="url(#shadeTop)"/>
            <rect y="521" width="312" height="120" fill="url(#shadeBottom)"/>

            <!-- progress bar story -->
            <g fill="#fff">
              <rect x="17"  y="21" width="89" height="3" rx="1.5" opacity=".4"/>
              <rect x="112" y="21" width="89" height="3" rx="1.5" opacity=".4"/>
              <rect x="208" y="21" width="89" height="3" rx="1.5" opacity=".4"/>
              <rect class="bar" x="17"  y="21" width="0" height="3" rx="1.5"/>
              <rect class="bar" x="112" y="21" width="0" height="3" rx="1.5"/>
              <rect class="bar" x="208" y="21" width="0" height="3" rx="1.5"/>
            </g>

            <circle cx="29" cy="51" r="14" fill="#4aa8ff"/>
            <rect x="15" y="592" width="210" height="24" rx="12" fill="none" stroke="#fff" stroke-width="1.5"/>
            <g fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
              <path transform="translate(242 592)" d="M12 20.5s-8-4.9-8-11A4.5 4.5 0 0 1 12 6.8 4.5 4.5 0 0 1 20 9.5c0 6.1-8 11-8 11z"/>
              <path transform="translate(275 592)" d="M21 3 3 10.5l7 2.5 2.5 7z"/>
            </g>
          </svg>

          <button class="sound" id="sound" type="button" aria-label="Nyalakan suara" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/>
              <g class="waves" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/>
              </g>

            </svg>
          </button>
        </div>
      </div>
      <p class="rotate-hint">Ketuk ikon speaker untuk menyalakan suara</p>
    </section>

    <!-- 5. CLOSING -->
    <section class="slide slide--closing" id="closing">
      <div class="duo duo--closing">
        <img class="duo__a" src="assets/closing-left.png" width="701" height="576" alt="Kucing memakai topi ulang tahun." draggable="false">
        <img class="duo__b" src="assets/closing-right.png" width="1374" height="659" alt="Make a wish. To many more years of joy!" draggable="false">
      </div>
    </section>
